user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_body_temp_path /tmp/client_body_temp;
    client_body_buffer_size 64k;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    proxy_max_temp_file_size 0;
    scgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;

    log_format privacy '$remote_addr $request_method $uri $status $body_bytes_sent '
                       '$request_time "$http_user_agent"';
    access_log /dev/stdout privacy;
    error_log /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=connections:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;

        client_max_body_size 64k;
        client_header_timeout 10s;
        client_body_timeout 10s;
        keepalive_timeout 30s;
        send_timeout 30s;
        limit_conn connections 30;
        limit_req_status 429;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;

        location = /auth/login {
            limit_req zone=login burst=5 nodelay;
            set $app_upstream app:8000;
            proxy_pass http://$app_upstream;
            include /etc/nginx/proxy_params;
        }

        location / {
            set $app_upstream app:8000;
            proxy_pass http://$app_upstream;
            include /etc/nginx/proxy_params;
        }
    }
}
