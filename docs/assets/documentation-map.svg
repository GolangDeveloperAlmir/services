<text x="350" y="170" class="k">02 / ENGINEERING</text><text x="350" y="207" class="t">Architecture & API</text><text x="350" y="234" class="s">Data · contracts · technology</text>
<rect x="604" y="130" width="250" height="130" rx="16" fill="#2a4168" stroke="#58729f"/>
<text x="628" y="170" class="k">03 / OPERATIONS</text><text x="628" y="207" class="t">Security & metrics</text><text x="628" y="234" class="s">Observability · testing · media</text>
<rect x="882" y="130" width="270" height="130" rx="16" fill="#2a4168" stroke="#58729f"/>
<text x="906" y="170" class="k">04 / GOVERNANCE</text><text x="906" y="207" class="t">Contributor guide</text><text x="906" y="234" class="s">Ownership · reporting · standards</text>
</g>
