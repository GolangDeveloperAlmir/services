name: Set up Python project
description: Install the pinned Python version and locked project dependencies.
inputs:
  python-version:
    description: Python version used by CI.
    required: false
    default: "3.14"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}
        version: "0.6.5"
    - run: uv sync --locked --all-groups
      shell: bash
