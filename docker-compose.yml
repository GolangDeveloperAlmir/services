services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user_service_test
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_service_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    networks:
      - data

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -ec
      - exec redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 192m
    pids_limit: 100
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - data

  app:
    image: user-service:ci
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: User Service
      APP_ENV: ${APP_ENV:-development}
      APP_ALLOWED_HOSTS: '${APP_ALLOWED_HOSTS:-["localhost","127.0.0.1","::1"]}'
      APP_TRUSTED_PROXY_IPS: '["172.30.240.2"]'
      APP_MEDIA_ROOT: /media
      DATABASE_URL: postgresql+asyncpg://user_service:${POSTGRES_PASSWORD}@db:5432/user_service_test
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-900}
      AUTH_RATE_LIMIT_ATTEMPTS: ${AUTH_RATE_LIMIT_ATTEMPTS:-5}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      AUTH_IP_RATE_LIMIT_ATTEMPTS: ${AUTH_IP_RATE_LIMIT_ATTEMPTS:-30}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-user-service}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      data: {}
      proxy:
        ipv4_address: 172.30.240.3
    volumes:
      - ./media:/media:ro
    command:
      - sh
      - -ec
      - |
        alembic upgrade head
        exec hypercorn app.main:app --bind 0.0.0.0:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.28-alpine
    # The mounted TLS private key is mode 0600 and owned by the invoking user.
    # Run Nginx as that same UID/GID; do not grant DAC_OVERRIDE or expose the key.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      ingress: {}
      proxy:
        ipv4_address: 172.30.240.2
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO /dev/null https://127.0.0.1:8443/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:

networks:
  ingress:
  data:
    internal: true
  proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.30.240.0/24
